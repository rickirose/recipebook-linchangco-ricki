{% extends 'base.html' %}

{% block content %}
<h2>{{ name }}</h2>
    <h3>Author: {{ recipe.author.name }}</h3>
    
    <ul>
    {% for ingredient in object.ingredients.all %}
        <li>{{ ingredient.ingredient.name }}
         - {{ ingredient.quantity }}</li>
    {% endfor %}
    </ul>
{% endblock %}

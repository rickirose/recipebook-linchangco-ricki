{% extends 'base.html' %}

{% block content %}
    <h2>Add Image to Recipe</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add Image</button>
    </form>
    <p><a href="{% url 'recipe' pk %}">Cancel</a></p>
{% endblock %}
